<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mochieiei ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      /* Daifuku Mochi Theme Palette */
      --mochi-pink: #f7cad0;
      --mochi-deep-pink: #d97486;
      --mochi-green: #d4e8b5;
      --mochi-dark-green: #8fac64;
      --bg-cream: #fcfaf7;
      --card-bg: rgba(255, 255, 255, 0.96);
      --border-soft: #f0e6dc;
      --text-main: #4a423d;
      --text-muted: #8c827a;
      --glow-shadow: 0 10px 30px rgba(247, 202, 208, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Quicksand', 'Mitr', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #faedf0 0%, #f7f9f1 55%, #fcfaf7 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating Emojis โมจิและของหวาน */
    .floating-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -60px;
      font-size: 24px;
      animation: floatUp 11s linear infinite;
      opacity: 0.75;
      filter: drop-shadow(0 2px 8px rgba(247, 202, 208, 0.35));
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      position: relative;
      z-index: 2;
    }

    /* Header Profile & Banner */
    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 16px 16px 26px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-soft);
      text-align: center;
      margin-bottom: 20px;
    }

    .banner-img {
      width: 100%;
      height: 145px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: -50px;
      border: 2px solid #fff;
      box-shadow: 0 4px 14px rgba(247, 202, 208, 0.28);
    }

    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 6px 18px rgba(212, 232, 181, 0.45);
      position: relative;
      z-index: 2;
      background: #fff;
    }

    .store-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--mochi-deep-pink);
      margin-top: 12px;
      letter-spacing: 0.5px;
    }

    .store-bio {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 8px;
      line-height: 1.65;
      white-space: pre-line;
      padding: 0 10px;
    }

    /* Section Cards */
    .section-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 22px 18px;
      box-shadow: var(--glow-shadow);
      border: 1.5px solid var(--border-soft);
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--mochi-dark-green);
      margin-bottom: 16px;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .links-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .work-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: #ffffff;
      border-radius: 22px;
      border: 1.5px solid var(--border-soft);
      text-decoration: none;
      color: var(--text-main);
      font-size: 14.5px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(247, 202, 208, 0.15);
      transition: all 0.25s ease;
    }

    .work-link:hover, .work-link:active {
      transform: translateY(-2px);
      background: #fff8fa;
      border-color: var(--mochi-pink);
      box-shadow: 0 6px 18px rgba(247, 202, 208, 0.3);
    }

    .link-icon-arrow {
      color: var(--mochi-deep-pink);
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.2s;
    }

    .work-link:hover .link-icon-arrow {
      transform: translateX(4px);
    }

    /* Posts Carousel (4 Posts) */
    .posts-scroll-container {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 4px 4px 14px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .posts-scroll-container::-webkit-scrollbar {
      height: 6px;
    }

    .posts-scroll-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .posts-scroll-container::-webkit-scrollbar-thumb {
      background: var(--mochi-green);
      border-radius: 10px;
    }

    .post-card {
      flex: 0 0 240px;
      background: #ffffff;
      border: 1.5px solid var(--border-soft);
      border-radius: 22px;
      overflow: hidden;
      scroll-snap-align: start;
      box-shadow: 0 6px 16px rgba(212, 232, 181, 0.2);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .post-card:hover {
      transform: translateY(-3px);
    }

    .post-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background: #faf6f0;
    }

    .post-body {
      padding: 12px 14px;
    }

    .post-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--mochi-deep-pink);
      margin-bottom: 4px;
    }

    .post-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Floating Emojis -->
  <div class="floating-container" id="emojiContainer"></div>

  <!-- Music Auto-play -->
  <audio id="bgMusic" loop autoplay playsinline src="https://files.catbox.moe/gqizpa.mp3"></audio>

  <div class="container">
    
    <!-- Profile & Banner -->
    <div class="header-card">
      <img id="mainBanner" src="https://i.postimg.cc/26YfhPc1/CA378830-D049-4F10-B91D-83E369F619D9.gif" alt="Banner GIF" class="banner-img">
      <img id="mainProfile" src="https://i.ibb.co/gZg1bdv9/IMG-3203.jpg" alt="Profile" class="profile-img">
      
      <h1 class="store-name" id="mainStoreName">mochieiei ♡</h1>
      <p class="store-bio" id="mainStoreBio">ยินดีต้อนรับเข้าสู่ร้าน mochieiei ♡ นะคะ
เชิญเลือกดูก่อนได้เลยน้า ขอบคุณที่กดเข้ามาดูค้าบ</p>
    </div>

    <!-- 3 Work Links -->
    <div class="section-card">
      <div class="section-title">Works & Links ♡</div>
      <div class="links-list" id="mainLinksContainer">
        <!-- ลิงก์ทั้ง 3 จะแสดงที่นี่ -->
      </div>
    </div>

    <!-- 4 Posts Carousel -->
    <div class="section-card">
      <div class="section-title">🎀 Recent Posts (เลื่อนดูได้นะคะ)</div>
      <div class="posts-scroll-container" id="mainPostsContainer">
        <!-- โพสต์จะถูกเติมที่นี่ -->
      </div>
    </div>

    <div class="footer-note">thank you for supporting mochieiei ♡</div>
  </div>

  <script>
    // 1. เชื่อมต่อ Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
      authDomain: "benefitie.firebaseapp.com",
      projectId: "benefitie",
      storageBucket: "benefitie.firebasestorage.app",
      messagingSenderId: "270365672215",
      appId: "1:270365672215:web:230d1491091e26ce83ed52"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 2. ข้อมูลตั้งต้น 3 ลิงก์
    const defaultData = {
      links: [
        { text: "ex group link", url: "https://drive.google.com/drive/folders/1TZ5ars62Dx5aoZq-W8FaA1goUHQ4k8zS" },
        { text: "ex group Animation", url: "https://drive.google.com/drive/folders/1IriQoDPzqKrLdkK1oYPitYy8iYAYS4TC" },
        { text: "menu", url: "https://drive.google.com/drive/folders/11IGZBhu4kqVtZlmBeRwewaQG90BJuxCV" }
      ]
    };

    function applyData(data) {
      if (!data) return;

      if (data.banner) document.getElementById('mainBanner').src = data.banner;
      if (data.profile) document.getElementById('mainProfile').src = data.profile;
      if (data.storeName) document.getElementById('mainStoreName').textContent = data.storeName;
      if (data.storeBio) document.getElementById('mainStoreBio').textContent = data.storeBio;

      // แสดง 3 ลิงก์
      const linksToShow = (data.links && Array.isArray(data.links) && data.links.length > 0) ? data.links : defaultData.links;
      const linkBox = document.getElementById('mainLinksContainer');
      linkBox.innerHTML = '';
      linksToShow.forEach(item => {
        const a = document.createElement('a');
        a.href = item.url || "#";
        a.target = "_blank";
        a.className = "work-link";
        a.innerHTML = `<span>${item.text || 'link example ♡'}</span><span class="link-icon-arrow">➔</span>`;
        linkBox.appendChild(a);
      });

      // แสดง 4 โพสต์
      if (data.posts && Array.isArray(data.posts)) {
        const postBox = document.getElementById('mainPostsContainer');
        postBox.innerHTML = '';
        data.posts.forEach(p => {
          const card = document.createElement('div');
          card.className = "post-card";
          card.innerHTML = `
            <img src="${p.img || 'https://i.ibb.co/gZg1bdv9/IMG-3203.jpg'}" alt="${p.title}" class="post-img">
            <div class="post-body">
              <h3 class="post-title">${p.title || ''}</h3>
              <p class="post-desc">${p.desc || ''}</p>
            </div>
          `;
          postBox.appendChild(card);
        });
      }

      // เพลง
      if (data.musicUrl) {
        const music = document.getElementById('bgMusic');
        if (music.src !== data.musicUrl) {
          music.src = data.musicUrl;
          music.play().catch(() => {});
        }
      }
    }

    try {
      const cached = localStorage.getItem('mochieiei_site_cache');
      if (cached) applyData(JSON.parse(cached));
      else applyData(defaultData);
    } catch (e) {
      applyData(defaultData);
    }

    // ดึงข้อมูล Real-time
    db.collection("mochieiei_site").doc("content").onSnapshot(doc => {
      if (doc.exists) {
        const live = doc.data();
        localStorage.setItem('mochieiei_site_cache', JSON.stringify(live));
        applyData(live);
      } else {
        applyData(defaultData);
      }
    }, err => {
      console.error("Firestore read error:", err);
    });

    // Auto-play Music
    const music = document.getElementById('bgMusic');
    function playAudio() {
      if (music.paused) {
        music.play().catch(() => {});
      }
    }
    window.addEventListener('DOMContentLoaded', () => {
      playAudio();
      document.body.addEventListener('click', playAudio, { once: true });
      document.body.addEventListener('touchstart', playAudio, { once: true });
    });

    // Floating Emojis ลูกเล่นขนมโมจิ
    const icons = ['🍡', '🍥', '🍮', '🍵',];
    const emojiContainer = document.getElementById('emojiContainer');

    function createEmoji() {
      const el = document.createElement('div');
      el.className = 'float-item';
      el.textContent = icons[Math.floor(Math.random() * icons.length)];
      el.style.left = Math.random() * 92 + 'vw';
      el.style.animationDuration = (8 + Math.random() * 5) + 's';
      emojiContainer.appendChild(el);

      setTimeout(() => { el.remove(); }, 14000);
    }
    setInterval(createEmoji, 1200);
  </script>
</body>
</html>
